<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b32"><title>My Daily Hisab</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head>
<body><header><div><small>PERSONAL FINANCE TRACKER</small><h1>My Daily Hisab</h1></div><button id="backupBtn" class="ghost">Backup</button></header>
<main><section class="switch"><button class="active" data-scope="all">All</button><button data-scope="shop">Shop</button><button data-scope="personal">Personal</button></section>
<section class="cards"><article><span>Total Income</span><strong id="incomeTotal">₹0</strong></article><article><span>Total Expenses</span><strong id="expenseTotal">₹0</strong></article><article class="balance"><span>Net Balance</span><strong id="balanceTotal">₹0</strong></article></section>
<section class="panel"><div class="panelhead"><h2>Add Transaction</h2><span id="today"></span></div><form id="entryForm"><div class="twocol"><label>Type<select id="type"><option value="income">Income</option><option value="expense">Expense</option></select></label><label>For<select id="scope"><option value="shop">Shop</option><option value="personal">Personal</option></select></label></div><div class="twocol"><label>Amount (₹)<input id="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 500" required></label><label>Date<input id="date" type="date" required></label></div><div class="twocol"><label>Category<select id="category"></select></label><label>Payment<select id="payment"><option>Cash</option><option>UPI</option><option>Bank</option><option>Other</option></select></label></div><label>Note (optional)<input id="note" maxlength="100" placeholder="Enter a short note"></label><button class="primary" id="saveBtn">+ Add Transaction</button><button type="button" id="cancelEdit" class="ghost hidden">Cancel Edit</button></form></section>
<section class="panel"><div class="panelhead"><h2>Transactions</h2><input id="month" type="month" aria-label="Filter month"></div><div id="transactions" class="transactions"></div></section>
<section class="panel tools"><h2>Data & Reports</h2><div class="twocol"><button id="exportCsv" class="secondary">Export CSV</button><button id="restoreBtn" class="secondary">Restore Backup</button></div><p>Your records are saved on this device. Export a backup regularly to keep a safe copy.</p><input id="restoreFile" type="file" accept="application/json" class="hidden"></section>
<footer>My Daily Hisab · Your records stay on this device</footer></main><script src="app.js"></script></body></html>
